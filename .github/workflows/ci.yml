name: CI

on:
  push:
    branches: [master]
    # Pre-release tags run the JavaScript build, which every push skips.
    tags:
      - '*alpha*'
      - '*beta*'
      - '*rc*'
  pull_request:

permissions:
  contents: read

# Per branch, so that pushing twice in a minute does not leave the first
# run grinding through work nobody is waiting for any more. Keyed on
# run_id before, which is unique, so a push never superseded anything.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions Nextcloud 34 and 35 run on, from the 8.3 the app asks for.
        php-version: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint
        run: |
          find appinfo lib templates -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

  php:
    # The tests and the analysis want the same PHP and the same vendor
    # directory, so they share them: two runners and two installs of the
    # same dependencies bought nothing but a second name in the list.
    name: PHP tests and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Cache the Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run the test suite
        run: composer test

      # Always, even when the tests failed: a type error and a broken test
      # are usually the same mistake, and seeing both saves a round trip.
      - name: Analyse
        if: '!cancelled()'
        run: composer psalm

  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # The download cache, keyed on the lock file, so an unchanged
          # dependency is not fetched again on every run.
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run the test suite
        run: npm run test:js

  build:
    name: JavaScript build
    # Only on pre-release tags: the committed bundles change rarely, and
    # rebuilding them on every push costs more than it catches.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # The download cache, keyed on the lock file, so an unchanged
          # dependency is not fetched again on every run.
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Check the committed bundles are up to date
        # The chunk hashes depend on the dependency versions, which the
        # lock file pins, so a difference means the bundles need a rebuild.
        run: |
          if ! git diff --quiet -- js/; then
            echo "::error::js/ differs from a fresh build, run 'npm run build' and commit the result"
            git status --short -- js/
            git diff --stat -- js/
            exit 1
          fi

  appinfo:
    name: App metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, libxml
          coverage: none

      - name: Validate info.xml against the Nextcloud schema
        run: |
          curl -sSfo /tmp/info.xsd https://apps.nextcloud.com/schema/apps/info.xsd
          php -r '
            $doc = new DOMDocument();
            $doc->load("appinfo/info.xml");
            libxml_use_internal_errors(true);
            if ($doc->schemaValidate("/tmp/info.xsd")) {
              echo "info.xml validates\n";
              exit(0);
            }
            foreach (libxml_get_errors() as $error) {
              fwrite(STDERR, trim($error->message) . "\n");
            }
            exit(1);
          '

      - name: Check the versions match
        run: |
          app=$(sed -n 's/.*<version>\(.*\)<\/version>.*/\1/p' appinfo/info.xml | head -1)
          npm=$(node -p "require('./package.json').version")
          echo "info.xml $app, package.json $npm"
          test "$app" = "$npm"
